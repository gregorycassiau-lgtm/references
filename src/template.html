<title>Références Les Conteurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet stone-paper frame, the work carries the colour. Small ink logo masthead, title hero, filter rail, 3-col index of clients, full-screen project sheet. */
:root{
  --paper:#ECEDE8; --paper-2:#E2E4DE; --ink:#151A17; --muted:#5D6560; --line:#C9CDC5; --accent:#2D3EB2; --on-accent:#F3F4F0; --brand:#2D3EB2; --coral:#FF7E6A;
  --shade:rgba(21,26,23,.06); --scrim:rgba(14,17,15,.92);
  --display:"Gloock", "Times New Roman", Georgia, serif;
  --body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter:clamp(16px,4vw,48px); --radius:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101412; --paper-2:#181D1A; --ink:#E8EBE5; --muted:#99A29C; --line:#2B322E; --accent:#A9B4FF; --on-accent:#0E1220; --brand:#C9D0FF;
  --shade:rgba(255,255,255,.05); --scrim:rgba(5,7,6,.95); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#101412; --paper-2:#181D1A; --ink:#E8EBE5; --muted:#99A29C; --line:#2B322E; --accent:#A9B4FF; --on-accent:#0E1220; --brand:#C9D0FF;
  --shade:rgba(255,255,255,.05); --scrim:rgba(5,7,6,.95); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{padding-inline:var(--gutter);max-width:1480px;margin-inline:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* Hero */
header.hero{padding-block:clamp(16px,4vw,48px) clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:end;border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px;color:var(--ink)}
.masthead .mono{color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.brand{display:block;color:var(--ink);line-height:0}
.brand .logo{display:block;width:clamp(118px,11vw,150px);height:auto}
.title{font:400 clamp(52px,8vw,112px)/.9 var(--display);letter-spacing:-.02em;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 14px}
.lede{font-size:clamp(17px,1.6vw,20px);line-height:1.5;margin:0 0 22px;max-width:46ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none}
.stats b{font:400 30px/1 var(--display);display:block;color:var(--ink);letter-spacing:0}
.stats li{color:var(--muted)}

/* Filters */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;padding-block:14px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.fgroup > span{margin-right:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{margin-left:auto;color:var(--muted)}

/* Index grid */
main{padding-block:clamp(24px,4vw,48px) 96px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,3.4vw,52px) clamp(16px,2.2vw,32px)}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0}
.cover{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;border-radius:var(--radius);background:var(--paper-2)}
.cover img,.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .3s}
.cover video{opacity:0}
.card:hover .cover img,.card:focus-visible .cover img{transform:scale(1.03)}
.card.playing .cover video{opacity:1}
.cover .tally{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.tally span{background:rgba(12,14,13,.72);color:#F1F2EE;border-radius:2px;padding:3px 7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;backdrop-filter:blur(4px)}
.card h2{font:400 clamp(24px,2.2vw,30px)/1.08 var(--display);margin:0;text-wrap:balance}
.card .meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--muted);font-size:14px}
.card .tags{color:var(--muted)}
.empty{padding:60px 0;color:var(--muted)}

/* Project sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.sheet-bar .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:20px}
.navbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.navbtn:hover{border-color:var(--ink)}
.sheet-head{padding-block:clamp(28px,5vw,64px) clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px 48px;align-items:end}
.sheet-head h1{font:400 clamp(44px,7.5vw,112px)/.92 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
.facts dt{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding-top:2px}
.facts dd{margin:0;font-size:15px}
.facts a{text-decoration-thickness:1px;text-underline-offset:3px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px 48px;padding-block:0 32px;max-width:1100px}
.story p{margin:0;font-size:17px;line-height:1.6;max-width:62ch}
.story-k{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px!important;font-size:12px!important}
.chapter{border-top:1px solid var(--line);padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
.chapter h3{font:400 26px/1.1 var(--display);margin:0;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.chapter h3 .mono{color:var(--muted)}
.reels{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin}
.reel{flex:0 0 clamp(200px,22vw,280px);scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.frame{position:relative;background:#0D0F0E;border-radius:var(--radius);overflow:hidden;max-width:100%}
.frame video{display:block;width:100%;height:100%;object-fit:contain;background:#0D0F0E}
.reel .frame{aspect-ratio:9/16}
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:22px 18px}
.film{display:flex;flex-direction:column;gap:8px;min-width:0}
.film .frame{aspect-ratio:16/9}
.cap{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cap .mono{color:var(--muted);white-space:nowrap}
.mason{columns:3 260px;column-gap:14px}
.mason button{display:block;width:100%;margin:0 0 14px;break-inside:avoid;border-radius:var(--radius);overflow:hidden;background:var(--paper-2)}
.mason img{display:block;width:100%;height:auto;transition:opacity .2s}
.mason button:hover img{opacity:.88}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:18px}
.doc{display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
.doc .page{aspect-ratio:3/4;max-width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.doc img{width:100%;height:100%;object-fit:cover;object-position:top}
.doc:hover .page{border-color:var(--ink)}
.doc span{font-size:14px}
.sheet-foot{border-top:1px solid var(--line);padding-block:28px 64px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next{font:400 clamp(28px,4vw,48px)/1 var(--display);text-align:right}
.next small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;grid-template-rows:auto 1fr auto;color:#EEF0EB;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px var(--gutter)}
.lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding:0 var(--gutter)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{display:flex;justify-content:center;gap:12px;padding:14px}
.lb .navbtn{border-color:rgba(238,240,235,.3);color:#EEF0EB}
.lb .navbtn:hover{border-color:#EEF0EB}

@media (max-width:1020px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  header.hero,.sheet-head{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 14px}
  .card h2{font-size:21px}
  .card .meta{flex-direction:column;gap:2px;font-size:13px}
  .rail .wrap{gap:8px}
  .fgroup{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
  .fgroup .chip{white-space:nowrap}
  .count{display:none}
  .reel{flex-basis:62vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="wrap hero">
  <div>
    <h1 class="title">Références</h1>
  </div>
  <div>
    <p class="lede">Films, contenus réseaux sociaux, campagnes publicitaires et newsletters réalisés pour des destinations, des offices de tourisme et des marques de l’hôtellerie touristique.</p>
    <ul class="stats mono" id="stats"></ul>
  </div>
</header>

<nav class="rail" aria-label="Filtres">
  <div class="wrap">
    <div class="fgroup" id="f-cat"><span class="mono">Expertise</span></div>
    <div class="fgroup" id="f-kind"><span class="mono">Contenu</span></div>
    <span class="count mono" id="count"></span>
  </div>
</nav>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Aucune référence ne correspond à ces filtres.</p>
</main>

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title"></section>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Visuel agrandi">
  <div class="lb-top"><span class="mono" id="lb-count"></span><button class="navbtn" id="lb-close">Fermer ✕</button></div>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-nav"><button class="navbtn" id="lb-prev">← Précédent</button><button class="navbtn" id="lb-next">Suivant →</button></div>
</div>

<script>
const DATA = /*DATA*/[];
const COVER = /*COVER*/{};
const CATS = ["Social media","Publicité","Photographie","Newsletters & automation","UGC"];
const KINDS = [["video","Vidéo"],["image","Visuels"],["doc","Documents"]];
const state = {cat:null, kind:null};

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const ratio = v => { const r=v.w/v.h; return r<0.7?"9:16":r<0.9?"4:5":r<1.1?"1:1":"16:9"; };

DATA.forEach(c=>{
  c.slug = slug(c.name);
  c.videos = c.chapters.flatMap(ch=>ch.videos);
  c.images = c.chapters.flatMap(ch=>ch.images);
  c.docs = c.chapters.flatMap(ch=>ch.docs);
  c.kinds = new Set([c.videos.length&&"video", c.images.length&&"image", c.docs.length&&"doc"].filter(Boolean));
});

function plural(n, one, many){ return `${n} ${n>1?many:one}`; }

// Stats
(() => {
  const v = DATA.reduce((a,c)=>a+c.videos.length,0), i = DATA.reduce((a,c)=>a+c.images.length,0), d = DATA.reduce((a,c)=>a+c.docs.length,0);
  const mins = Math.round(DATA.reduce((a,c)=>a+c.videos.reduce((x,y)=>x+y.d,0),0)/60);
  document.getElementById("stats").innerHTML =
    [[DATA.length,"clients"],[v,"vidéos"],[mins+" min","de films"],[i,"visuels"],[d,"documents"]]
    .map(([n,l])=>`<li><b>${n}</b>${l}</li>`).join("");
})();

// Filters
function chips(el, items, key){
  items.forEach(([val,label])=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=label; b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ state[key] = state[key]===val?null:val; render(); };
    b.dataset.val=val; el.appendChild(b);
  });
}
chips(document.getElementById("f-cat"), CATS.map(c=>[c,c]), "cat");
chips(document.getElementById("f-kind"), KINDS, "kind");

function coverOf(c){
  if (COVER[c.name]) return COVER[c.name];
  if (c.videos.length) return `p/${c.videos[0].id}.webp`;
  if (c.images.length) return `i/${c.images[0].id}.webp`;
  return `d/${c.docs[0].cover}`;
}

function render(){
  document.querySelectorAll("#f-cat .chip").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.val===state.cat)));
  document.querySelectorAll("#f-kind .chip").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.val===state.kind)));
  const list = DATA.filter(c => (!state.cat || c.cats.includes(state.cat)) && (!state.kind || c.kinds.has(state.kind)));
  document.getElementById("count").textContent = plural(list.length,"référence","références");
  document.getElementById("empty").hidden = list.length>0;
  document.getElementById("grid").innerHTML = list.map(c=>{
    const t=[];
    if(c.videos.length) t.push(plural(c.videos.length,"vidéo","vidéos"));
    if(c.images.length) t.push(plural(c.images.length,"visuel","visuels"));
    if(c.docs.length) t.push(plural(c.docs.length,"doc","docs"));
    const prev = c.videos[0] ? `<video muted loop playsinline preload="none" data-src="v/${c.videos[0].id}.mp4"></video>` : "";
    return `<button class="card" data-slug="${c.slug}">
      <div class="cover"><img src="${coverOf(c)}" alt="" loading="lazy">${prev}
        <div class="tally">${t.map(x=>`<span>${x}</span>`).join("")}</div></div>
      <h2>${esc(c.name)}</h2>
      <div class="meta"><span>${esc(c.sector)}</span><span class="tags mono">${esc(c.cats.join(" / "))}</span></div>
    </button>`;
  }).join("");
  document.querySelectorAll(".card").forEach(card=>{
    card.onclick=()=>open(card.dataset.slug);
    const v=card.querySelector("video"); if(!v) return;
    card.addEventListener("mouseenter",()=>{ if(matchMedia("(hover:hover)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches){ if(!v.src) v.src=v.dataset.src; v.play().then(()=>card.classList.add("playing")).catch(()=>{}); }});
    card.addEventListener("mouseleave",()=>{ v.pause(); card.classList.remove("playing"); });
  });
}

// Project sheet
const sheet = document.getElementById("sheet");
let current = -1, lastFocus = null;

function videoEl(v){
  return `<div class="frame"><video controls playsinline preload="none" poster="p/${v.id}.webp" src="v/${v.id}.mp4"></video></div>
    <div class="cap"><span>${esc(v.t)}</span><span class="mono">${ratio(v)} · ${dur(v.d)}</span></div>`;
}

function chapterHTML(ch, c, multi){
  const reels = ch.videos.filter(v=>v.h>v.w*1.1), films = ch.videos.filter(v=>!(v.h>v.w*1.1));
  const n=[]; if(ch.videos.length) n.push(plural(ch.videos.length,"vidéo","vidéos")); if(ch.images.length) n.push(plural(ch.images.length,"visuel","visuels")); if(ch.docs.length) n.push(plural(ch.docs.length,"document","documents"));
  const title = multi ? `<h3>${esc(ch.label||"Contenus")} <span class="mono">${n.join(" · ")}</span></h3>` : "";
  let h = "";
  if(films.length) h += `<div class="films">${films.map(v=>`<figure class="film" style="margin:0">${videoEl(v)}</figure>`).join("")}</div>`;
  if(reels.length) h += `<div class="reels">${reels.map(v=>`<figure class="reel" style="margin:0">${videoEl(v)}</figure>`).join("")}</div>`;
  if(ch.images.length) h += `<div class="mason">${ch.images.map(im=>`<button data-img="${im.id}" aria-label="Agrandir le visuel"><img src="i/${im.id}.webp" width="${im.w}" height="${im.h}" loading="lazy" alt="${esc(c.name)}"></button>`).join("")}</div>`;
  if(ch.docs.length) h += `<div class="docs">${ch.docs.map(d=>`<a class="doc" href="d/${d.id}.pdf" target="_blank" rel="noopener"><div class="page"><img src="d/${d.cover}" alt="" loading="lazy"></div><span>${esc(d.t)} <span class="mono" style="color:var(--muted)">PDF ↗</span></span></a>`).join("")}</div>`;
  return `<section class="chapter">${title}${h}</section>`;
}

function open(s, push=true){
  const idx = DATA.findIndex(c=>c.slug===s); if(idx<0) return;
  current = idx; const c = DATA[idx]; const nx = DATA[(idx+1)%DATA.length], pv = DATA[(idx-1+DATA.length)%DATA.length];
  if(sheet.hidden) lastFocus = document.activeElement;
  const facts = [];
  facts.push(["Secteur", esc(c.sector)]);
  if(c.cats.length) facts.push(["Expertise", esc(c.cats.join(", "))]);
  if(c.supports.length) facts.push(["Supports", esc(c.supports.join(", "))]);
  if(c.markets.length) facts.push(["Marchés", c.markets.join(" ")]);
  if(c.links.length) facts.push(["En ligne", c.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join("<br>")]);
  const multi = c.chapters.length>1;
  sheet.innerHTML = `
    <div class="sheet-bar"><div class="wrap">
      <button class="navbtn" id="s-close">← Toutes les références</button>
      <span class="crumb" aria-hidden="true">${esc(c.name)}</span>
      <button class="navbtn" id="s-prev" aria-label="Référence précédente : ${esc(pv.name)}">←</button>
      <button class="navbtn" id="s-next" aria-label="Référence suivante : ${esc(nx.name)}">→</button>
    </div></div>
    <div class="wrap">
      <div class="sheet-head"><h1 id="sheet-title">${esc(c.name)}</h1><dl class="facts mono">${facts.map(([k,v])=>`<dt>${k}</dt><dd style="font-family:var(--body)">${v}</dd>`).join("")}</dl></div>
      ${(c.context||c.results)?`<div class="story">${c.context?`<div><p class="mono story-k">Contexte</p><p>${esc(c.context).replace(/\n+/g,"<br><br>")}</p></div>`:""}${c.results?`<div><p class="mono story-k">Résultats</p><p>${esc(c.results).replace(/\n+/g,"<br><br>")}</p></div>`:""}</div>`:""}
      ${c.chapters.map(ch=>chapterHTML(ch,c,multi)).join("")}
      <div class="sheet-foot"><button class="navbtn" id="s-top">↑ Haut de page</button>
        <button class="next" id="s-next2"><small>Référence suivante</small>${esc(nx.name)} →</button></div>
    </div>`;
  sheet.hidden = false; sheet.scrollTop = 0; document.body.style.overflow = "hidden";
  sheet.querySelector("#s-close").onclick = close;
  sheet.querySelector("#s-prev").onclick = ()=>open(pv.slug);
  sheet.querySelector("#s-next").onclick = sheet.querySelector("#s-next2").onclick = ()=>open(nx.slug);
  sheet.querySelector("#s-top").onclick = ()=>sheet.scrollTo({top:0,behavior:"smooth"});
  sheet.querySelectorAll("video").forEach(v=>v.addEventListener("play",()=>sheet.querySelectorAll("video").forEach(o=>{ if(o!==v) o.pause(); })));
  const imgs = c.images.map(i=>i.id);
  sheet.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>lbOpen(imgs, imgs.indexOf(b.dataset.img)));
  sheet.querySelector("#s-close").focus({preventScroll:true});
  if(push){ try{ history.replaceState(null,"","#"+c.slug); }catch(e){} }
}
function close(){
  sheet.querySelectorAll("video").forEach(v=>v.pause());
  sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; current=-1;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(lastFocus) lastFocus.focus({preventScroll:true});
}

// Lightbox
const lb = document.getElementById("lb"); let lbList=[], lbI=0;
function lbShow(){ document.getElementById("lb-img").src=`i/${lbList[lbI]}.webp`; document.getElementById("lb-count").textContent=`${lbI+1} / ${lbList.length}`; }
function lbOpen(list,i){ lbList=list; lbI=i; lbShow(); lb.hidden=false; document.getElementById("lb-close").focus(); }
function lbStep(d){ lbI=(lbI+d+lbList.length)%lbList.length; lbShow(); }
document.getElementById("lb-close").onclick=()=>{ lb.hidden=true; };
document.getElementById("lb-prev").onclick=()=>lbStep(-1);
document.getElementById("lb-next").onclick=()=>lbStep(1);
lb.addEventListener("click",e=>{ if(e.target===lb||e.target.classList.contains("lb-stage")) lb.hidden=true; });

document.addEventListener("keydown",e=>{
  if(!lb.hidden){ if(e.key==="Escape") lb.hidden=true; if(e.key==="ArrowRight") lbStep(1); if(e.key==="ArrowLeft") lbStep(-1); return; }
  if(!sheet.hidden){ if(e.key==="Escape") close();
    if(e.target.tagName!=="VIDEO"){ if(e.key==="ArrowRight") open(DATA[(current+1)%DATA.length].slug); if(e.key==="ArrowLeft") open(DATA[(current-1+DATA.length)%DATA.length].slug); } }
});

render();
const h = decodeURIComponent(location.hash.slice(1)); if(h) open(h,false);
</script>
